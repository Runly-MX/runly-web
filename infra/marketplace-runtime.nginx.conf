# Runly Marketplace managed
# Include before generic regex locations in the existing TLS server block.
# Only resource details and publisher profiles reach Astro. Never use an SPA fallback.
location = /marketplace/sitemap.xml {
    proxy_pass http://127.0.0.1:4398;
    proxy_set_header Host $host;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    error_page 502 504 =503 @runly_marketplace_unavailable;
}
location ~ ^/marketplace/(publicadores|plantillas-studio|automatizaciones|plantillas-website|soluciones)/[^/]+/?$ {
    proxy_pass http://127.0.0.1:4398;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    error_page 502 504 =503 @runly_marketplace_unavailable;
}
location @runly_marketplace_unavailable {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header Retry-After "60" always;
    return 503 '<!doctype html><html lang="es"><title>Marketplace temporalmente no disponible</title><h1>Marketplace temporalmente no disponible</h1><p>Vuelve a intentarlo en unos minutos.</p></html>';
}
