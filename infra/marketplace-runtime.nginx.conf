# Include inside the existing server block. Static root points to dist/client.
# Only resource details and publisher profiles reach Astro. Never use an SPA fallback.
location = /marketplace/sitemap.xml {
    proxy_pass http://127.0.0.1:4398;
    proxy_set_header Host $host;
    proxy_cache off;
    proxy_intercept_errors off;
}
location ~ ^/marketplace/(publicadores|plantillas-studio|automatizaciones|plantillas-website|soluciones)/[^/]+/?$ {
    proxy_pass http://127.0.0.1:4398;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    proxy_intercept_errors off;
}
