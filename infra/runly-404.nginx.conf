# Runly 404 managed
# Include inside the HTTPS server block of runly.mx. 403 is mapped too because a
# directory without index.html (e.g. /documentacion/guias/) answers 403 with
# autoindex off. The page ships in dist/client/404.html.
error_page 403 404 /404.html;
location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex" always;
}
